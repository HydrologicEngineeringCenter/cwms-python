[tool.poetry]
name = "cwms-python"
repository = "https://github.com/HydrologicEngineeringCenter/cwms-python"

# Managed by Release Please; runtime versions come from package metadata.
version = "1.0.9"

packages = [
    { include = "cwms" },
]
description = "Corps water management systems (CWMS) REST API for Data Retrieval of USACE water data"
readme = "README.md"
license = "LICENSE"
keywords = ["USACE", "water data", "CWMS"]
authors = ["Eric Novotny <eric.v.novotny@usace.army.mil>"]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.3.3"
# Require NumPy wheels for newer Python versions while retaining Python 3.9.
numpy = [
    {version = ">=1.23.5,<3", python = ">=3.9,<3.13"},
    {version = ">=2.1.0,<3", python = ">=3.13,<3.14"},
    {version = ">=2.3.3,<3", python = ">=3.14"},
]
requests-toolbelt = "^1.0.0"
requests = [
    {version = "^2.32.4", python = ">=3.9,<3.10"},
    {version = "^2.33.0", python = ">=3.10"},
]
# Keep the Python 3.9 fallback while requiring patched releases on newer Python.
urllib3 = [
    {version = ">=2.6.3,<2.7", python = ">=3.9,<3.10"},
    {version = "^2.7.0", python = ">=3.10"},
]

[tool.poetry.group.dev.dependencies]
black = [
    {version = "^25.1.0", python = ">=3.9,<3.10"},
    {version = "^26.3.1", python = ">=3.10"},
]
isort = "^5.13.2"
mypy = "^1.9.0"
pre-commit = "^3.6.2"
pytest = [
    {version = "^8.3.5", python = ">=3.9,<3.10"},
    {version = "^9.0.3", python = ">=3.10"},
]
requests-mock = "^1.11.0"
pytest-cov = "^4.1.0"
pandas-stubs = "^2.2.1.240316"
types-requests = "^2.31.0.20240311"
yamlfix = "^1.16.0"
setuptools = [
    {version = ">=82.0.1,<83", python = ">=3.9,<3.10"},
    {version = ">=83.0.0", python = ">=3.10"},
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.yamlfix]
comments_min_spaces_from_content = 1
whitelines = 1
explicit_start = false
preserve_quotes = true
