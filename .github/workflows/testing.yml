name: Testing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: testing-${{ github.event_name }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run tests and generate code coverage report.
  run-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.x']

    steps:
      - uses: actions/checkout@v7

      - name: Set Up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Unlike the code-check workflow, this job requires the dev dependencies to be
      # installed to make sure we have the necessary, tools, stub files, etc.
      - name: Install Poetry
        uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4

      - name: Cache Virtual Environment
        uses: actions/cache@v6
        with:
          path: ./.venv
          key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-venv-${{
            hashFiles('poetry.lock') }}

      - name: Install Dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ':all:'
        run: poetry install

      # Run pytest and generate coverage report data.
      - name: Run Tests
        run: poetry run pytest tests/mock/ --doctest-modules --cov --cov-report=xml:out/coverage.xml

      # Run mypy with strict mode enabled. Only the main source code is type checked (test
      # and example code is excluded).
      - name: Check Types
        run: poetry run mypy --strict cwms/

      - name: Generate Coverage Report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: out/coverage.xml
          format: markdown
          output: both
          badge: true

      - name: Generate Job Summary
        uses: x-color/github-actions-job-summary@91bbfe6fb3ba53c9d0304991601cf2508e8098a2 # v0.1.1
        with:
          file: ./code-coverage-results.md
          vars: |-
            empty: empty
