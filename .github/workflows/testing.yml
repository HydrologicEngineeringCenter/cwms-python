name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      coverage:
        description: CDA integration coverage
        type: choice
        options: [full, representative]
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      integration: ${{ steps.plan.outputs.integration }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select coverage
        id: plan
        run: python3 .github/scripts/ci_policy.py plan

  format:
    uses: ./.github/workflows/code-check.yml

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: poetry run pytest tests/mock/ --doctest-modules --cov --cov-report=xml:out/coverage.xml
      - name: Test CI policy
        run: poetry run python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check types
        run: poetry run mypy --strict cwms/
      - name: Summarize coverage
        run: poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  integration:
    needs: [plan]
    if: needs.plan.outputs.integration == 'true'
    uses: ./.github/workflows/CDA-testing.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}

  required:
    name: CI required
    needs: [plan, format, unit, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require successful applicable checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_policy.py gate
