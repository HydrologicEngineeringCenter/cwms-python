name: CDA integration

on:
  workflow_call:
    inputs:
      matrix:
        description: Explicit Python/CDA/schema combinations selected by CI
        required: true
        type: string

jobs:
  integration-tests:
    name: integration-tests (Python ${{ matrix.python }}, CDA ${{ matrix.cda }}, schema
      ${{ matrix.schema }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      CWMS_DATA_API_IMAGE: ${{ matrix.image }}
      CWMS_DATABASE_IMAGE: ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/database-ready-ora-23.5:${{ matrix.tag }}
      CWMS_SCHEMA_INSTALLER_IMAGE: ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/schema_installer:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python }}
      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - name: Set up backend
        run: |
          docker compose pull
          docker compose up -d --wait --wait-timeout 2400
      - name: Run integration tests
        run: poetry run pytest tests/cda/ --doctest-modules --cov --cov-report=xml:out/coverage.xml
      - name: Summarize coverage
        run: poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop test backend
        if: always()
        run: docker compose down --volumes
