name: CDA integration (PR production, weekly exhaustive)

on:
  pull_request:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cda-integration-${{ github.event_name }}-${{ github.event.pull_request.number
    || github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: integration-tests (Python ${{ matrix.python-version }}, CDA ${{ matrix.cda }},
      schema ${{ matrix.schema }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version: ['3.9', '3.x']
        # Ordinary PRs run two production combinations. Release Please PRs,
        # weekly runs, and manual runs exercise all 18 combinations.
        cda: ${{ fromJSON(github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') && '["production"]' || '["latest", "production", "test"]') }}
        schema: ${{ fromJSON(github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') && '["production"]' || '["latest", "production", "test"]') }}

    env:
      # Keep the release pins in sync with the environments (see CONTRIBUTING.md).
      CWMS_DATA_API_IMAGE: ghcr.io/usace/cwms-data-api:${{ fromJSON('{"latest":"develop-nightly","production":"2026.05.12-i","test":"2026.08.31-testd"}')[matrix.cda] }}
      CWMS_DATABASE_IMAGE: ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/database-ready-ora-23.5:${{ fromJSON('{"latest":"latest-dev","production":"26.02.17","test":"26.07.16-RC02"}')[matrix.schema] }}
      CWMS_SCHEMA_INSTALLER_IMAGE: ghcr.io/hydrologicengineeringcenter/cwms-database/cwms/schema_installer:${{ fromJSON('{"latest":"latest-dev","production":"26.02.17","test":"26.07.16-RC02"}')[matrix.schema] }}

    steps:
      - uses: actions/checkout@v7

      - name: Clean up disk space, so we don't run out.
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Set up backend
        run: |
          docker compose pull
          docker compose up -d --wait --wait-timeout 2400

      - name: Set Up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Use actions-poetry to handle installation
      - name: Install Poetry and Dependencies
        uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4

      # Set Poetry to use an in-project virtual environment
      - name: Configure Poetry for in-project venv
        run: poetry config virtualenvs.in-project true

          # Poetry will handle installation and caching
      - name: Cache Python dependencies
        uses: actions/cache@v6
        id: cache-poetry-venv
        with:
          path: .venv
          key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-poetry-${{
            hashFiles('poetry.lock') }}

      - name: Install dependencies
        env:
          POETRY_INSTALLER_ONLY_BINARY: ':all:'
        run: poetry install --no-root

      # Run pytest and generate coverage report data.
      - name: Run Tests
        run: poetry run pytest tests/cda/ --doctest-modules --cov --cov-report=xml:out/coverage.xml

      - name: Generate Coverage Report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: out/coverage.xml
          format: markdown
          output: both
          badge: true

      - name: Generate Job Summary
        uses: x-color/github-actions-job-summary@91bbfe6fb3ba53c9d0304991601cf2508e8098a2 # v0.1.1
        with:
          file: ./code-coverage-results.md
          vars: |-
            empty: empty

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop test backend
        if: always()
        run: docker compose down --volumes
