name: PR Title Release Hint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  hint-title-format:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        uses: actions/github-script@v9
        with:
          script: |-
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;
            const expected = /^[a-zA-Z][a-zA-Z0-9-]*(\([^)\r\n]+\))?!?:[^\S\r\n]+\S/;
            const marker = "<!-- pr-title-release-hint -->";

            if (expected.test(pr.title)) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number,
                  per_page: 100,
                }
              );

              const existing = comments.find((comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body && comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            const body = `${marker}
            Please give this PR a title in the form \`<type>: short description\`.

            Consider renaming the PR title to one of these forms:
            - \`fix: short description\` (patch)
            - \`feat: short description\` (minor)
            - \`feat!: short description\` (major)
            - \`test: short description\` (tests)
            - \`docs: short description\` (documentation)
            - \`ci: short description\` (CI workflows)
            - \`chore: short description\` (maintenance)

            **Version bumps require these commit markers:**
            - **Major** (\`1.2.3 → 2.0.0\`): mark a breaking change with \`!\` after the type or scope, such as \`feat!:\` or \`fix(parser)!:\`, or include a \`BREAKING CHANGE: description\` footer in the merged commit. **\`feat:\` alone does not trigger a major bump.**
            - **Minor** (\`1.2.3 → 1.3.0\`): use \`feat:\` for compatible new functionality, without a breaking-change marker.
            - **Patch** (\`1.2.3 → 1.2.4\`): use \`fix:\` for compatible bug fixes. This repository also releases patches for \`perf:\`, \`revert:\`, \`deps:\`, and \`docs:\` without a breaking-change marker.
            - Ordinary \`test:\`, \`ci:\`, \`build:\`, \`chore:\`, \`refactor:\`, and \`style:\` commits do not trigger a release on their own.

            The highest required bump across commits since the last release wins: **major over minor over patch**.

            If this PR will be squash-merged, the PR title often becomes the commit message on the default branch, which affects whether the next release is patch, minor, or major.

            Scoped titles such as \`fix(parser): handle missing values\` and other types such as \`refactor:\` and \`style:\` are also supported. This is an advisory reminder; choose the type that describes the change. A title with a type prefix and a description will not receive this reminder.

            See the repository guidance in [\`CONTRIBUTING.md\`](https://github.com/${owner}/${repo}/blob/${pr.base.ref}/CONTRIBUTING.md#releases).`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100,
              }
            );

            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" &&
                comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
